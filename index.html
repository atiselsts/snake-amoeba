<!doctype html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#86d3f6">
  <title>Čūskamēba</title>
  <link rel="stylesheet" href="src/fonts.css">
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <canvas id="view"></canvas>

  <header id="hud" hidden>
    <div id="level-name" class="chip"></div>
    <div id="lives" class="chip" aria-live="polite"></div>
    <div id="meter" class="chip">
      <span id="meter-label"></span>
      <div id="meter-bar"><div id="meter-fill"></div></div>
      <span id="meter-value"></span>
    </div>
    <div id="hud-buttons">
      <button id="btn-sound" class="round" type="button"></button>
      <button id="btn-pause" class="round" type="button"></button>
    </div>
  </header>

  <p id="toast" role="status" hidden></p>

  <section id="menu" class="screen" hidden>
    <div class="panel wide">
      <div class="lang">
        <button type="button" data-lang="lv">LV</button>
        <button type="button" data-lang="en">EN</button>
      </div>
      <div class="stars chip" id="menu-stars"></div>
      <canvas id="mascot" width="520" height="130"></canvas>
      <h1 id="menu-title"></h1>
      <p id="menu-tagline"></p>
      <h2 id="menu-choose"></h2>
      <div id="levels"></div>
    </div>
  </section>

  <section id="looks" class="screen" hidden>
    <div class="panel">
      <div class="stars chip" id="looks-stars"></div>
      <h2 id="looks-title"></h2>
      <p id="looks-level"></p>
      <canvas id="preview" width="560" height="170"></canvas>
      <h3 id="looks-pattern"></h3>
      <div id="skins"></div>
      <h3 id="looks-color"></h3>
      <div id="colors"></div>
      <div id="perks"></div>
      <div id="buy"></div>
      <div class="actions">
        <button id="btn-looks-back" class="plain" type="button"></button>
        <button id="btn-start" class="main" type="button"></button>
      </div>
    </div>
  </section>

  <section id="result" class="screen dim" hidden>
    <div class="panel small">
      <h2 id="result-title"></h2>
      <p id="result-text"></p>
      <p id="result-stats"></p>
      <p id="result-reward"></p>
      <div class="actions">
        <button id="btn-result-menu" class="plain" type="button"></button>
        <button id="btn-result-main" class="main" type="button"></button>
      </div>
    </div>
  </section>

  <section id="paused" class="screen dim" hidden>
    <div class="panel small">
      <h2 id="paused-title"></h2>
      <div class="actions">
        <button id="btn-paused-menu" class="plain" type="button"></button>
        <button id="btn-resume" class="main" type="button"></button>
      </div>
    </div>
  </section>

  <script src="src/world.js"></script>
  <script src="src/art.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/i18n.js"></script>
  <script src="src/game.js"></script>
</body>
</html>
